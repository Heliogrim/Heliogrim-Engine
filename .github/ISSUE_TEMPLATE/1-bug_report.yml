name: Bug Report
description: Create a report to help us improve
labels: [ bug ]
body:
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "How does the system currently behave."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "How should the system behave, when everything would be right?"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "----"
  - type: textarea
    id: repro
    attributes:
      label: "To Reproduce"
      description: "Steps to reproduce the behavior:"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "Platform"
      placeholder: "Windows x64 10.0.19045 Build 19045"
  - type: input
    id: version
    attributes:
      label: "Version"
      placeholder: "1.0.123-rc"
  - type: input
    id: subsystem
    attributes:
      label: "Subsystem(s)"
      placeholder: "Graphics/Acceleration, Graphics/Material, Editor/Material, ..."
  - type: markdown
    attributes:
      value: "----"
  - type: textarea
    id: context
    attributes:
      label: "Additional context/remarks"
      description: "Add any other context about the problem here."
