name: Feature request
description: Suggest an idea for this project
labels: [ enhancement ]
body:
  - type: textarea
    id: reasoning
    attributes:
      label: "⚡ Is there an underlying problem to be solved?"
      description: "If there is any, provide a description of the problem."
      placeholder: "When adding a new actor to the scene, the system should ... to solve ..."
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: "📝 What should the system provide?"
      description: "Name the key points, what the feature should be about and what it will provide."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: "✅ How do we know it is done?"
      description: "List checkable results. For editor/reflow flows use Given/When/Then, for technical systems state the contract."
      placeholder: "Given a storage with a read-only repository, when a mutate is requested, then ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "🧭 What is covered now, what is left for later?"
      description: "Name the cases covered by this change and the ones the design should only leave room for."
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: "🕶️ How should the solution look like to achieve the points above?"
      description: "If you already have a idea or description for a solution, please provide this."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "----"
  - type: textarea
    id: considerations
    attributes:
      label: "💬 Do you have any additional considerations?"
      description: "Are there any constrains, edge cases or target cases, which should be resolved?"
    validations:
      required: false
  - type: textarea
    id: information
    attributes:
      label: "ℹ️ Is there any documentation or related information?"
      description: "If there is any external documentation or information available, please provide accessible links, so we can consider already existing solutions..."
    validations:
      required: false