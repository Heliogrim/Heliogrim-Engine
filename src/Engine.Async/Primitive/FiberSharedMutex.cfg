\* Add statements after this line.
\* N=3 agents cover writer, reader and second waiter; about 5 min with the
\* liveness property. For a seconds-long invariant-only run, drop PROPERTIES
\* and add `SYMMETRY Sym` (symmetry is unsound for ~> properties).
CONSTANTS Agents = {a1, a2, a3}
          None = None
SPECIFICATION Spec
INVARIANTS Exclusion WordWriter WordReaders WaitingFlag QueuedReaders NoOrphanedWaiter
PROPERTIES NoLostWakeup
CHECK_DEADLOCK TRUE
